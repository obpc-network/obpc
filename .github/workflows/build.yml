name: OBPC - Build

on:
  push:
    branches: [ "master", "develop" ] # Agora observa as duas
    tags: [ 'v*' ]

jobs:
  build-linux:
    runs-on: [self-hosted, linux-build]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OBPC
        run: |
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obpc-linux-binaries
          path: build/bin/